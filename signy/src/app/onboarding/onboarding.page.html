<ion-content [fullscreen]="true" class="signy-content">
 <ng-container *ngIf="listo">
  <div class="top-actions">
    <button class="skip-btn" *ngIf="!esUltimo" (click)="saltar()">Saltar</button>
  </div>

  <div class="onboarding-wrap">
    <div class="slide-image-wrap" *ngIf="slides[paso].imagen as imagen">
      <!-- alt vacío: la imagen ilustra el título que va justo debajo -->
      <img *ngIf="esImagenLocal(imagen); else imagenRemota" [src]="imagen" alt="" class="slide-image" decoding="async" />
      <ng-template #imagenRemota>
        <img [appCachedSrc]="imagen" alt="" class="slide-image" />
      </ng-template>
    </div>

    <div class="slide-menu-wrap" *ngIf="slides[paso].menu as menu">
      <div class="slide-menu-item" *ngFor="let item of menu">
        <span class="slide-menu-icon"><ion-icon [name]="item.icono"></ion-icon></span>
        <span class="slide-menu-label">{{ item.etiqueta }}</span>
      </div>
    </div>

    <div class="slide-text">
      <h1>{{ slides[paso].titulo }}</h1>
      <p>{{ slides[paso].texto }}</p>
    </div>

    <div class="dots">
      <button
        *ngFor="let s of slides; let i = index"
        class="dot"
        [class.active]="i === paso"
        (click)="irAPaso(i)"
        [attr.aria-label]="'Ir al paso ' + (i + 1)">
      </button>
    </div>

    <div class="nav-row">
      <ion-button
        fill="clear"
        class="btn-back"
        *ngIf="paso > 0"
        (click)="anterior()">
        Atrás
      </ion-button>
      <ion-button expand="block" class="btn-fox" (click)="siguiente()">
        {{ esUltimo ? 'Crear cuenta' : 'Siguiente' }}
      </ion-button>
    </div>
  </div>
 </ng-container>
</ion-content>
