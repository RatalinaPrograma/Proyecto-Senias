<ion-content [fullscreen]="true" class="signy-content">
  <div class="auth-wrap">
    <div class="auth-header">
      <ion-icon name="paw" class="auth-paw"></ion-icon>
      <h1>¡Hola de nuevo!</h1>
      <p>Inicia sesión para seguir aprendiendo LSCh</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="iniciarSesion()" autocomplete="off" class="auth-form">

      <ion-input
        label="Email"
        labelPlacement="floating"
        fill="outline"
        type="email"
        formControlName="email"
        class="signy-input">
      </ion-input>
      <ion-text class="field-error" *ngIf="email?.invalid && email?.touched">
        <p *ngIf="email?.errors?.['required']">El email es obligatorio</p>
        <p *ngIf="email?.errors?.['email']">Ingresa un email válido</p>
      </ion-text>

      <ion-input
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        type="password"
        formControlName="password"
        class="signy-input">
      </ion-input>
      <ion-text class="field-error" *ngIf="password?.invalid && password?.touched">
        <p *ngIf="password?.errors?.['required']">La contraseña es obligatoria</p>
      </ion-text>

      <ion-text class="form-error" *ngIf="errorMsg">
        <p>{{ errorMsg }}</p>
      </ion-text>

      <ion-button expand="block" type="submit" [disabled]="cargando" class="btn-fox">
        <ion-spinner *ngIf="cargando" name="dots"></ion-spinner>
        <span *ngIf="!cargando">Iniciar sesión</span>
      </ion-button>

      <ion-button expand="block" fill="clear" type="button" (click)="irARegistro()" class="btn-link">
        ¿No tienes cuenta? &nbsp;<strong>Regístrate</strong>
      </ion-button>
    </form>
  </div>
</ion-content>
