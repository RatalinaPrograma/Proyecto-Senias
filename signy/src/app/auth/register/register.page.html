<ion-content class="ion-padding">
  <ion-input
    label="Nombre completo"
    labelPlacement="floating"
    fill="outline"
    [(ngModel)]="fullName"
    type="text"
    class="ion-margin-bottom">
  </ion-input>

  <ion-input
    label="Email"
    labelPlacement="floating"
    fill="outline"
    [(ngModel)]="email"
    type="email"
    class="ion-margin-bottom">
  </ion-input>

  <ion-input
    label="Contraseña"
    labelPlacement="floating"
    fill="outline"
    [(ngModel)]="password"
    type="password"
    class="ion-margin-bottom">
  </ion-input>

  <ion-text color="danger" *ngIf="errorMsg">
    <p>{{ errorMsg }}</p>
  </ion-text>

  <ion-text color="success" *ngIf="exito">
    <p>¡Cuenta creada! Revisa tu correo para confirmar (si tienes esa opción activada en Supabase), o inicia sesión directamente.</p>
  </ion-text>

  <ion-button expand="block" (click)="registrar()" [disabled]="cargando" class="ion-margin-top">
    <ion-spinner *ngIf="cargando" name="dots"></ion-spinner>
    <span *ngIf="!cargando">Registrarse</span>
  </ion-button>

  <ion-button expand="block" fill="clear" (click)="irALogin()">
    ¿Ya tienes cuenta? Inicia sesión
  </ion-button>
</ion-content>
