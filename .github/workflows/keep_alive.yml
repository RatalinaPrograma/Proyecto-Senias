name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 00:00 UTC (Dos veces por semana)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite ejecutar el script manualmente desde GitHub si lo deseas

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta HTTP a Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
